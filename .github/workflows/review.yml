name: Conventions review
on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: e022kklund/pr-conventions-reviewer@v0
        with:
          anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
